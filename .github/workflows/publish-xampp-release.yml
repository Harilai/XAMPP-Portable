name: Build portable XAMPP 8.5.13 ZIP

on:
  push:
    branches:
      - xampp-8.5.13

permissions:
  contents: write

jobs:
  portable:
    name: Extract official payload, repair portable folders and publish ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify official installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://downloads.sourceforge.net/project/xampp/XAMPP%20Windows/8.5.13/xampp-windows-x64-8.5.13-0-VS17-installer.exe" \
            -o "xampp-windows-x64-8.5.13-0-VS17-installer.exe"
          echo "c23b29639715d3a9800dc86b0274f6cacc4b5114556f474a84f42d4cbba7e640  xampp-windows-x64-8.5.13-0-VS17-installer.exe" | sha256sum -c -

      - name: Extract installer payload without running the installer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir extracted
          7z x "xampp-windows-x64-8.5.13-0-VS17-installer.exe" -oextracted -y
          control="$(find extracted -type f -iname 'xampp-control.exe' -print -quit)"
          if [ -z "$control" ]; then
            echo "xampp-control.exe was not found in the extracted installer payload."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          root="$(dirname "$control")"
          mkdir -p portable
          cp -a "$root"/. portable/
          test -f portable/xampp-control.exe
          test -f portable/php/php.exe
          test -f portable/apache/bin/httpd.exe
          mkdir -p portable/apache/logs portable/mysql/data
          touch portable/apache/logs/keep.txt
          touch portable/mysql/data/keep.txt
          zip -qr "XAMPP-8.5.13-portable-Windows-x64.zip" portable
          unzip -tq "XAMPP-8.5.13-portable-Windows-x64.zip"
          unzip -Z1 "XAMPP-8.5.13-portable-Windows-x64.zip" | grep -Fxq 'portable/xampp-control.exe'
          unzip -Z1 "XAMPP-8.5.13-portable-Windows-x64.zip" | grep -Fxq 'portable/apache/logs/keep.txt'
          sha256sum "XAMPP-8.5.13-portable-Windows-x64.zip" > SHA256SUMS.txt

      - name: Replace installer assets with the portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v8.5.13 >/dev/null 2>&1; then
            gh release delete-asset v8.5.13 "xampp-windows-x64-8.5.13-0-VS17-installer.exe" --yes || true
            gh release delete-asset v8.5.13 "SHA256SUMS.txt" --yes || true
          fi

      - name: Publish portable package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.5.13
          name: XAMPP 8.5.13 portable (Windows x64)
          target_commitish: xampp-8.5.13
          body: |
            XAMPP 8.5.13 portable para Windows x64.

            El paquete se genera extrayendo el payload del instalador oficial sin ejecutar el asistente de instalación. Incluye las carpetas de logs/data necesarias para una extracción portable.

            Se verifica SHA-256 del instalador oficial, la presencia de xampp-control.exe, PHP y Apache, y la integridad CRC del ZIP.

            La ejecución real de Apache, MariaDB y PHP debe probarse en Windows sin elevación; la extracción estática no certifica por sí sola el arranque en todos los equipos.
          files: |
            XAMPP-8.5.13-portable-Windows-x64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
