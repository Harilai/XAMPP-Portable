name: Publish XAMPP 8.3.36 Windows installer

on:
  push:
    branches:
      - xampp-8.3.36

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download official SourceForge installer
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://downloads.sourceforge.net/project/xampp/XAMPP%20Windows/8.3.36/xampp-windows-x64-8.3.36-0-VC16-installer.exe" \
            -o "xampp-windows-x64-8.3.36-0-VC16-installer.exe"
          echo "dd54667c0c379cc137a92889857bd809c24a619f18eacb09c7376ef914391bbf  xampp-windows-x64-8.3.36-0-VC16-installer.exe" | sha256sum -c -
          printf '%s  %s\n' "dd54667c0c379cc137a92889857bd809c24a619f18eacb09c7376ef914391bbf" "xampp-windows-x64-8.3.36-0-VC16-installer.exe" > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.3.36
          name: XAMPP 8.3.36 Windows x64 (VC16)
          target_commitish: xampp-8.3.36
          body: |
            Instalador oficial de XAMPP 8.3.36 para Windows x64, descargado desde SourceForge.

            Archivo: xampp-windows-x64-8.3.36-0-VC16-installer.exe
            SHA-256 comprobado en el workflow antes de publicar.

            **Este asset es un instalador .exe, no un paquete portable ZIP.**
            Revisa los requisitos de Microsoft Visual C++ Redistributable de la versión antes de instalar.
            El arranque de Apache, MariaDB y PHP debe probarse en Windows; esta publicación no certifica ejecución local.
          files: |
            xampp-windows-x64-8.3.36-0-VC16-installer.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
