name: Build portable XAMPP 8.3.36 ZIP

on:
  push:
    branches:
      - xampp-8.3.36

permissions:
  contents: write

jobs:
  portable:
    name: Build and validate portable ZIP
    runs-on: windows-latest
    steps:
      - name: Download and verify official installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'xampp-windows-x64-8.3.36-0-VC16-installer.exe'
          curl.exe -fL --retry 3 --retry-delay 2 'https://downloads.sourceforge.net/project/xampp/XAMPP%20Windows/8.3.36/xampp-windows-x64-8.3.36-0-VC16-installer.exe' -o $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne 'dd54667c0c379cc137a92889857bd809c24a619f18eacb09c7376ef914391bbf') { throw "Installer SHA-256 mismatch: $actual" }

      - name: Install to default staging path and package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xampp = 'C:\xampp'
          if (Test-Path $xampp) { Remove-Item $xampp -Recurse -Force }
          & ".\xampp-windows-x64-8.3.36-0-VC16-installer.exe" --mode unattended --unattendedmodeui none
          $installerExit = $LASTEXITCODE
          Write-Host "Installer exit code: $installerExit"
          if ($installerExit -ne 0) { throw "XAMPP installer returned exit code $installerExit" }
          if (-not (Test-Path (Join-Path $xampp 'xampp-control.exe'))) {
            Get-ChildItem 'C:\' -Filter 'xampp-control.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 FullName | Format-Table -AutoSize | Out-String | Write-Host
            throw "xampp-control.exe not found at $xampp after unattended installation."
          }
          foreach ($required in @('php\php.exe','apache\bin\httpd.exe','mysql\bin\mysqld.exe','setup_xampp.bat')) {
            if (-not (Test-Path (Join-Path $xampp $required))) { throw "Missing required payload: $required" }
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $xampp 'apache\logs') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $xampp 'mysql\data') | Out-Null
          if (-not (Test-Path (Join-Path $xampp 'apache\logs\keep.txt'))) { Set-Content (Join-Path $xampp 'apache\logs\keep.txt') 'Apache logs directory placeholder.' }
          if (-not (Test-Path (Join-Path $xampp 'mysql\data\keep.txt'))) { Set-Content (Join-Path $xampp 'mysql\data\keep.txt') 'MariaDB data directory placeholder.' }
          Push-Location $xampp
          try {
            & .\php\php.exe -v
            if ($LASTEXITCODE -ne 0) { throw 'PHP smoke test failed' }
            & .\apache\bin\httpd.exe -t
            if ($LASTEXITCODE -ne 0) { throw 'Apache configuration test failed' }
            & .\mysql\bin\mysqld.exe --version
            if ($LASTEXITCODE -ne 0) { throw 'MariaDB binary smoke test failed' }
          } finally { Pop-Location }
          $stage = Join-Path $env:RUNNER_TEMP 'package'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $xampp (Join-Path $stage 'xampp') -Recurse -Force
          $zip = "XAMPP-8.3.36-portable-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage 'xampp') -DestinationPath $zip -CompressionLevel Optimal
          $check = Join-Path $env:RUNNER_TEMP 'verify-zip'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $check -Force
          foreach ($required in @('xampp\xampp-control.exe','xampp\php\php.exe','xampp\apache\bin\httpd.exe','xampp\mysql\bin\mysqld.exe','xampp\apache\logs')) {
            if (-not (Test-Path (Join-Path $check $required))) { throw "ZIP validation failed: $required" }
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Replace installer assets with portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete-asset v8.3.36 'xampp-windows-x64-8.3.36-0-VC16-installer.exe' --yes
          gh release delete-asset v8.3.36 'SHA256SUMS.txt' --yes

      - name: Publish portable ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.3.36
          name: XAMPP 8.3.36 portable (Windows x64)
          target_commitish: xampp-8.3.36
          body: |
            XAMPP 8.3.36 portable para Windows x64.
            ZIP reconstruido desde el payload oficial en runner Windows, sin instalar servicios.
            Se valida hash de origen, PHP, configuración Apache, MariaDB y extracción del ZIP.
            Extrae en una carpeta escribible y ejecuta setup_xampp.bat para adaptar las rutas. No instales servicios Windows.
          files: |
            XAMPP-8.3.36-portable-Windows-x64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
