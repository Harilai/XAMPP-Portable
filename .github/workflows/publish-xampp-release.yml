name: Build portable XAMPP 8.3.36 ZIP

on:
  push:
    branches:
      - xampp-8.3.36

permissions:
  contents: write

jobs:
  portable:
    name: Install to isolated user folder and package portable ZIP
    runs-on: windows-latest
    steps:
      - name: Download and verify official installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'xampp-windows-x64-8.3.36-0-VC16-installer.exe'
          curl.exe -fL --retry 3 --retry-delay 2 'https://downloads.sourceforge.net/project/xampp/XAMPP%20Windows/8.3.36/xampp-windows-x64-8.3.36-0-VC16-installer.exe' -o $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne 'dd54667c0c379cc137a92889857bd809c24a619f18eacb09c7376ef914391bbf') { throw "Installer SHA-256 mismatch: $actual" }

      - name: Extract XAMPP into an isolated directory without registering services
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'xampp-portable'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          $p = Start-Process -FilePath '.\xampp-windows-x64-8.3.36-0-VC16-installer.exe' -ArgumentList @('--mode','unattended','--unattendedmodeui','none','--prefix',$root) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "XAMPP unattended extraction returned exit code $($p.ExitCode)" }
          foreach ($required in @('xampp-control.exe','php\php.exe','apache\bin\httpd.exe')) {
            if (-not (Test-Path (Join-Path $root $required))) { throw "Missing required payload: $required" }
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'apache\logs') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'mysql\data') | Out-Null
          if (-not (Test-Path (Join-Path $root 'apache\logs\keep.txt'))) { Set-Content (Join-Path $root 'apache\logs\keep.txt') 'Apache logs directory placeholder.' }
          if (-not (Test-Path (Join-Path $root 'mysql\data\keep.txt'))) { Set-Content (Join-Path $root 'mysql\data\keep.txt') 'MySQL data directory placeholder.' }
          $zip = "XAMPP-8.3.36-portable-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          $check = Join-Path $env:RUNNER_TEMP 'verify-zip'
          Expand-Archive -Path $zip -DestinationPath $check -Force
          foreach ($required in @('xampp-control.exe','php\php.exe','apache\bin\httpd.exe','apache\logs')) {
            if (-not (Test-Path (Join-Path $check $required))) { throw "ZIP validation failed: $required" }
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Replace installer assets with the portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete-asset v8.3.36 'xampp-windows-x64-8.3.36-0-VC16-installer.exe' --yes
          gh release delete-asset v8.3.36 'SHA256SUMS.txt' --yes

      - name: Publish portable package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.3.36
          name: XAMPP 8.3.36 portable (Windows x64)
          target_commitish: xampp-8.3.36
          body: |
            XAMPP 8.3.36 portable para Windows x64.

            El paquete se genera en Windows a partir del instalador oficial mediante modo unattended en un directorio aislado. No se instala como servicio de Windows.

            Se verifica SHA-256 del origen, presencia de los ejecutables principales y extracción de comprobación del ZIP.

            La ejecución funcional de Apache, MariaDB y PHP debe probarse en Windows con una cuenta estándar; la creación del ZIP no certifica por sí sola el arranque en todos los equipos.
          files: |
            XAMPP-8.3.36-portable-Windows-x64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
